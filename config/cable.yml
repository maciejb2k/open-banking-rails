development:
  # Redis (not :async) so broadcasts fired from Sidekiq workers reach
  # WebSocket clients connected to the Puma process. The :async adapter
  # is single-process and silently drops cross-process broadcasts.
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: open_banking_rails_development

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: open_banking_rails_production
