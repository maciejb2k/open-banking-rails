# PostgreSQL. Versions 9.3 and up are supported.
#
# Development/test: POSTGRES_* envs from .env (dotenv-rails auto-loads).
# Production:       DATABASE_URL is the source of truth (set via compose).

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  host:     <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port:     <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>
  database: <%= ENV.fetch("POSTGRES_DB", "open_banking_rails_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  host:     <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port:     <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>
  database: open_banking_rails_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
