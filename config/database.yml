# PostgreSQL. Versions 9.3 and up are supported.
#
# Connection configured via environment variables from .env
# (auto-loaded by dotenv-rails in development/test).
#
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "open_banking_rails_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: open_banking_rails_test

production:
  <<: *default
  database: open_banking_rails_production
  username: open_banking_rails
  password: <%= ENV["OPEN_BANKING_RAILS_DATABASE_PASSWORD"] %>
