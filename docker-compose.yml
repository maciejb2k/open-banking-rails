# Development compose. Hosts the data services Rails needs while the app
# itself runs on the host (`bin/dev` / `Procfile.dev`). The full
# observability stack (OTel collector, Prometheus, Loki, Tempo, Grafana,
# Alertmanager) is opt-in via the `observability` profile so a normal
# `docker compose up` stays light.
#
#   docker compose up -d                       # db + redis only
#   docker compose --profile observability up -d   # everything

name: obr-dev

services:
  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.148.0
    profiles: ["observability"]
    volumes:
      - ./docker/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "1888:1888"    # pprof
      - "8888:8888"    # collector metrics
      - "8889:8889"    # prometheus exporter
      - "13133:13133"  # health_check
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "55679:55679"  # zpages
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.10.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=2GB"
    volumes:
      - ./docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - ./docker/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.31.1
    profiles: ["observability"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yaml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./docker/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"

  tempo:
    image: grafana/tempo:2.10.3
    profiles: ["observability"]
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.6.7
    profiles: ["observability"]
    command:
      - "-config.file=/etc/loki/loki-config.yaml"
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:12.4.1
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - alertmanager
      - tempo
      - loki

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  tempo_data:
  loki_data:
  grafana_data:
